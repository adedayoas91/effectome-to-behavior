[project]
name = "effectome-behavior-encoder-runtime"
version = "0.1.0"
description = "Isolated CPU runtime for the continuous behavior/dynamics encoder."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.9.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
