[project]
name = "effectome"
version = "0.1.0"
description = "From dynamic effectomes to behavior: causal-structure-learning of time-varying neural connectivity and its link to a behavioral manifold."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sadiq Adedayo" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "statsmodels>=0.14",
    "h5py>=3.9",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Causal structure learning (PCMCI+)
csl = ["tigramite>=5.2"]
# Community detection backends
community = ["python-igraph>=0.11", "leidenalg>=0.10"]
# Behavioral manifold learning
manifold = ["umap-learn>=0.5", "cebra>=0.4"]
# Deconvolution of calcium traces
deconv = ["oasis-deconv>=0.4"]
# Everything for a full run
full = [
    "tigramite>=5.2",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "umap-learn>=0.5",
    "cebra>=0.4",
]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/effectome"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
# Factory functions use PascalCase by project convention (Factory/Registry pattern);
# uppercase X/Y/B are standard linear-algebra matrix notation.
ignore = ["N802", "N806"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
