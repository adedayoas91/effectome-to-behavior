# Proposed simulator-specific gates. Freeze before a confirmatory execution.
# Do not tune these values on the same seeds used to claim acceptance.
version: proposed-driver-validation-v1
min_positive_seeds: 20
min_null_seeds: 60
min_origins: 20
min_events: 5
min_alignment_accuracy: 0.8
min_intervention_effect: 0.10
nomination_threshold: 0.01
min_availability: 0.9
min_topk_recovery: 0.75
min_group_win_fraction: 0.75
min_mean_log_loss_gain: 0.0
max_null_false_nomination_probability: 0.05
confidence_level: 0.95
bootstrap_replicates: 2000
analysis_seed: 42
