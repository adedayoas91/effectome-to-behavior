# Root Hydra config for the effectome pipeline.
defaults:
  - data: synthetic
  - preprocess: default
  - windowing: primary_physical
  - connectivity: cgc
  - states: default
  - community: temporal
  - manifold: classical
  - linking: default
  - evaluation: default
  - intervention: default
  - _self_

seed: 42

# Where pipeline artifacts are written/read (relative to the Hydra run dir's project root).
paths:
  artifacts: outputs/artifacts
  figures: outputs/figures
  # Optional complete raw-data manifest consumed by pipeline/08_evaluate.py.
  evaluation_manifest: null

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
