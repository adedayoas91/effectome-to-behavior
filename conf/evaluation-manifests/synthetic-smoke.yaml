# Small development-only raw-to-score example. This is not a publication benchmark.
seed: 7

data:
  name: synthetic
  dataset_id: synthetic-smoke
  recording_id: synthetic-smoke-0
  n_neurons: 4
  n_timepoints: 160
  density: 0.25
  max_lag: 1
  coupling: 0.2
  noise_std: 0.2
  n_states: 2
  regime_dwell: 40
  behavior_drivers: 1
  fps: 1.0
  seed: 7

preprocess: {}

windowing:
  mode: temporal
  length: 32
  history_length: 32
  target_length: 8
  stride: 8
  standardize_per_window: false
  categorical_summary: last_valid

evaluation:
  profile: revised_primary
  mode: development
  protocol: purged_blocked
  n_outer_folds: 2
  embargo: 0
  min_train_examples: 2
  min_test_examples: 1
  endpoint_name: motif
  endpoint_kind: synthetic_regime_label
  endpoint_type: categorical
  categorical_summary: last_valid
  positive_lag: 1
  class_vocabulary_source: observed_development_only
  neural_lambda1_grid: [0.0]
  decoder_c_grid: [1.0]
