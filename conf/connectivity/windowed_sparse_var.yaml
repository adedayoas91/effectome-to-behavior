# Independent-window sparse VAR baseline. This is an adaptation policy, not the static fit.
name: windowed_sparse_var
max_lag: 2
alpha: 0.05
partial: false
ridge: 0.001
absolute: false
threshold: 0.0
extra:
  n_lags: 2
  lambda1: 0.0
  lambda2: 0.001
  standardize: true
  max_iter: 10000
  tol: 1.0e-6
  lag_aggregation: sum
