# Stage 3: connectivity-state clustering + Markov transition modeling.
graph_states:
  n_states: 3
  select_k: false      # set true to pick K by silhouette over [k_min, k_max]
  k_min: 2
  k_max: 8
  standardize: true
  # Graph-space geometry for Fréchet quantization of the effectome:
  #   feature metrics (KMeans):        frobenius | cosine | log_euclidean
  #   signed kernel metric (spectral): causal_kernel
  #   distance metrics (k-medoids):    affine_invariant | gromov_wasserstein
  metric: causal_kernel
  eps: 1.0e-6           # eigenvalue floor for SPD projection (log_euclidean/affine_invariant)
  gw_epsilon: 0.05      # entropic regularization for gromov_wasserstein
  gw_max_iter: 200
  kernel_gamma: 1.0
  seed: 42
transitions:
  laplace: 1.0
  n_null: 500
  heldout_fraction: 0.3
  seed: 42
probabilistic:
  n_states: 3
  n_components: 8
  standardize: true
  covariance_floor: 1.0e-4
  n_iter: 50
  tol: 1.0e-4
  seed: 42
