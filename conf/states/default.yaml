# Graph states are optional predictive summaries. Latent regimes need raw-process calibration.
analysis_scope: prospective  # descriptive explicitly permits full-series visual summaries
selection:
  candidate_counts: [1, 2, 3, 4, 6]
  assignments: [kmeans, gaussian_mixture]
  outer_test_fraction: 0.25
  inner_validation_fraction: 0.25
  min_train_pairs: 4
  ridge_penalties: [0.1, 1.0, 10.0]
  minimum_relative_gain: 0.01  # proposed compression margin, not biological significance
graph_states:
  n_states: 1
  select_k: false             # nested selection is owned by states.selection above
  k_min: 1
  k_max: 6
  standardize: true
  metric: frobenius
  feature_representation: signed_lag_offdiag
  assignment: kmeans
  pca_components: 8
  mixture_reg_covar: 0.001
  mixture_n_init: 5
  mixture_max_iter: 200
  analysis_scope: prospective
  seed: 42
transitions:
  laplace: 1.0
  n_null: 500                 # used only by explicit descriptive label diagnostics
  heldout_fraction: 0.3
  seed: 42
probabilistic:
  enabled: false             # exploratory HMM requires explicit opt-in
  n_states: 1
  n_components: 8
  standardize: true
  covariance_floor: 1.0e-4
  n_iter: 50
  tol: 1.0e-4
  seed: 42
