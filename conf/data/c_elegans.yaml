  preprocessing:
    detrend: false
    zscore: false
    deconvolve: false
    smooth_window: 0
    drop_low_variance: 0.0
    bundle_net_bandpass: true
    bundle_net_low_fraction: 1.0e-10
    bundle_net_high_fraction: 0.05
    bundle_net_filter_order: 4
  paired_window_length: 15
